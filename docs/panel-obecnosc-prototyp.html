<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obecność · Światło · Ruch — prototyp panelu</title>
<style>
  :root{
    --bg:#F4F4F0; --panel:#1A1C1E; --sec:#33362F; --mute:#5A5D54; --line:#BCBFB6;
    --card:#FFFFFF; --blue:#2563C4; --amber:#B8901F; --sun:#E0A92E; --green:#4D9A4D; --red:#C04A3A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--panel);
    font-family:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:20px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:20px;font-weight:700;letter-spacing:1.5px;margin:0 0 2px}
  .sub{color:var(--mute);font-size:13px;margin:0 0 18px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .card{background:var(--card);border-radius:12px;padding:14px 16px}
  .card .lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .val{font-size:26px;font-weight:600;margin-top:4px}
  .card .val small{font-size:14px;color:var(--mute);font-weight:400}
  .sect{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .sect h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--sec);margin:0 0 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .barrow .k{width:64px;color:var(--sec)}
  .barrow .track{flex:1;height:14px;background:#ECECE6;border-radius:7px;overflow:hidden}
  .barrow .fill{height:100%;border-radius:7px}
  .barrow .v{width:70px;text-align:right;color:var(--mute)}
  .ins{background:#EEF3EA;border-radius:12px;padding:14px 18px;color:#27400f;font-size:14px;line-height:1.55}
  .ins b{font-weight:600}
  .foot{color:var(--mute);font-size:12px;margin-top:14px;line-height:1.5}
  text{font-family:inherit}
  @media(max-width:640px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>OBECNOŚĆ · ŚWIATŁO · RUCH</h1>
  <p class="sub" id="sub">łazienka · dane z czujnika ruchu (PIR) i światła (LDR)</p>

  <div class="cards" id="cards"></div>

  <div class="sect">
    <h2>Kiedy najczęściej ktoś jest w łazience</h2>
    <div id="hourly"></div>
  </div>

  <div class="two">
    <div class="sect">
      <h2>Światło — jasno vs ciemno</h2>
      <div id="light"></div>
    </div>
    <div class="sect">
      <h2>Jak długo trwa ruch</h2>
      <div id="dur"></div>
    </div>
  </div>

  <div class="ins" id="insight"></div>

  <p class="foot" id="foot"></p>
</div>

<script>
// ——— DANE ———
// PROTOTYP: migawka z /api/diag (noc 23.07). W panelu na urządzeniu ten obiekt
// zastąpi: const d = await (await fetch('/api/diag')).json();  — reszta kodu bez zmian.
const d = {
  sensors: {
    pir_by_hour: [15,0,0,0,0,0,0,65,9,6,44,42,0,0,0,0,8,0,0,0,36,27,74,0],
    pir_total_s: 920, pir_pulses: 326,
    pir_width_ms: [0,0,254,72,0,0],
    pir_gap_ms:   [20,141,81,37,27,9,3],
    ldr_hist: [169254,54758,69443,550,1195,163,12,6,3,598,672,1,1,85591,0,0],
    pir_meas: { collected_s: 99471 }
  }
};

const s = d.sensors;
const days = s.pir_meas.collected_s / 86400;
const perDay = n => n / days;

// —— karty podsumowania ——
const byh = s.pir_by_hour;
const busiest = byh.indexOf(Math.max(...byh));
const longGaps = s.pir_gap_ms[5] + s.pir_gap_ms[6];        // przerwy >5 min ~ granice wizyt
const visitsDay = Math.round(perDay(longGaps));
const ldrSec = s.ldr_hist.map(x => x/4);                    // 4 próbki/s
const bright = ldrSec.slice(9).reduce((a,b)=>a+b,0);        // >=640 mV = jasno
const brightHDay = (bright/days/3600);

const cards = [
  ['Wejść dziennie', '~'+visitsDay, ''],
  ['Ruch aktywny', Math.round(perDay(s.pir_total_s)/60), ' min/dobę'],
  ['Najruchliwsza godz.', String(busiest).padStart(2,'0')+':00', ''],
  ['Światło jasne', brightHDay.toFixed(1).replace('.',','), ' h/dobę'],
];
document.getElementById('cards').innerHTML = cards.map(c =>
  `<div class="card"><div class="lbl">${c[0]}</div><div class="val">${c[1]}<small>${c[2]}</small></div></div>`).join('');

document.getElementById('sub').textContent =
  `łazienka · okno obserwacji ${days.toFixed(2).replace('.',',')} doby · ${s.pir_pulses} impulsów ruchu, PIR + LDR`;

// —— wykres godzinowy (inline SVG) ——
(function(){
  const W=820,H=180,padL=8,padR=8,padB=26,padT=8;
  const bw=(W-padL-padR)/24, maxv=Math.max(...byh,1);
  const bars=byh.map((v,h)=>{
    const bh=(H-padB-padT)*(v/maxv);
    const x=padL+h*bw, y=H-padB-bh;
    const top=[22,7,10,11,20].includes(h);
    return `<rect x="${x+2}" y="${y}" width="${bw-4}" height="${bh}" rx="2" fill="${top?'#2563C4':'#9DB8DD'}"><title>${String(h).padStart(2,'0')}:00 — ${Math.round(perDay(v))} imp./dobę</title></rect>`;
  }).join('');
  const ticks=[0,6,12,18,23].map(h=>`<text x="${padL+h*bw+bw/2}" y="${H-8}" font-size="11" fill="#5A5D54" text-anchor="middle">${h}</text>`).join('');
  const base=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#BCBFB6"/>`;
  document.getElementById('hourly').innerHTML=
    `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Obecność wg godzin doby">${base}${bars}${ticks}</svg>
     <div style="color:#5A5D54;font-size:12px;margin-top:2px">godzina doby · niebieskie = szczyty (7–11 rano, 20–22 wieczór)</div>`;
})();

// —— światło ——
(function(){
  const dark=ldrSec.slice(0,3).reduce((a,b)=>a+b,0);
  const tot=ldrSec.reduce((a,b)=>a+b,0);
  const mid=tot-dark-bright;
  const pct=x=>Math.round(x/tot*100);
  const row=(k,v,frac,col)=>`<div class="barrow"><span class="k">${k}</span><span class="track"><span class="fill" style="width:${(frac*100).toFixed(0)}%;background:${col}"></span></span><span class="v">${v}</span></div>`;
  document.getElementById('light').innerHTML=
    row('Ciemno', pct(dark)+'%', dark/tot, '#3A3D44')+
    row('Zmierzch', pct(mid)+'%', mid/tot, '#B8C6DD')+
    row('Jasno', pct(bright)+'%', bright/tot, '#E0A92E')+
    `<div style="color:#5A5D54;font-size:12px;margin-top:8px">Jasno ≈ ${brightHDay.toFixed(1).replace('.',',')} h/dobę. „Jasno" to poziom LDR ≥ ~640 mV (światło włączone lub dzień przez okno).</div>`;
})();

// —— długość ruchu ——
(function(){
  const w=s.pir_width_ms, names=['<0,1 s','0,1–1 s','1–3 s','3–10 s','10–60 s','>60 s'];
  const tot=w.reduce((a,b)=>a+b,0)||1, max=Math.max(...w,1);
  const rows=w.map((v,i)=> v? `<div class="barrow"><span class="k">${names[i]}</span><span class="track"><span class="fill" style="width:${(v/max*100).toFixed(0)}%;background:#B8901F"></span></span><span class="v">${Math.round(v/tot*100)}%</span></div>`:'').join('');
  document.getElementById('dur').innerHTML=rows+
    `<div style="color:#5A5D54;font-size:12px;margin-top:8px">Ruch to głównie krótkie impulsy 1–3 s — ktoś się porusza, nie stoi. Dłuższe (3–10 s) to zwykle wchodzenie/wychodzenie.</div>`;
})();

// —— wniosek ——
document.getElementById('insight').innerHTML =
  `<b>Co z tego wynika:</b> domownicy bywają w łazience głównie <b>rano (7–11)</b> i <b>wieczorem (20–22)</b>,
   ze szczytem o <b>${String(busiest).padStart(2,'0')}:00</b>. Dzienny ruch to ok. <b>${Math.round(perDay(s.pir_total_s)/60)} min</b>
   aktywnego czujnika w ~<b>${visitsDay} wejściach</b>. Światło jest jasne ~<b>${brightHDay.toFixed(1).replace('.',',')} h/dobę</b> —
   warto sprawdzić, czy godziny „jasno" pokrywają się z obecnością; nadmiar to kandydat na „zostawione światło".`;

document.getElementById('foot').textContent =
  'Prototyp panelu (dane: migawka /api/diag). Po wpięciu do panelu urządzenia sekcja pobiera dane na żywo i odświeża się przyciskiem. Liczby „na dobę" liczone z okna obserwacji (collected_s), nie z uptime.';
</script>
</body>
</html>
